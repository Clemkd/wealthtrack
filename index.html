<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/wealthtrack/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WealthTrack – Portefeuille crypto et fiscalité</title>
    <script type="module" crossorigin src="/wealthtrack/assets/index-DTDMDhRO.js"></script>
    <link rel="stylesheet" crossorigin href="/wealthtrack/assets/index-BPcKp3CU.css">
  </head>
  <body>
    <div id="root">
      <div id="app-loading" style="display:flex;align-items:center;justify-content:center;height:100vh;font-family:system-ui,sans-serif;color:#666">
        Chargement…
      </div>
    </div>
    <script>
      window.addEventListener('error', function(e) {
        if (document.getElementById('app-loading')) {
          var d = document.getElementById('root');
          var pre = document.createElement('pre');
          pre.textContent = (e.message || 'Unknown error') + '\n' + (e.filename || '') + ':' + (e.lineno || '');
          var h2 = document.createElement('h2');
          h2.textContent = 'Erreur de chargement';
          var wrap = document.createElement('div');
          wrap.style.cssText = 'padding:2rem;font-family:monospace;color:red';
          wrap.appendChild(h2);
          wrap.appendChild(pre);
          d.innerHTML = '';
          d.appendChild(wrap);
        }
      });
    </script>
  </body>
</html>
